# docker-compose.yml — OSHConnect Publisher Fleet
#
# Usage:
#   docker compose up -d              # start all publishers
#   docker compose up -d nws          # start NWS only
#   docker compose logs -f nws        # follow NWS logs
#   docker compose down               # stop all
#   docker compose ps                 # check status
#
# All publishers share the same OSH server credentials via the x-osh-env anchor.
# Set these values in publishers/.env or export them before running docker compose.
# See publishers/.env.example for a template.

x-osh-env: &osh-env
  OSH_ADDRESS: ${OSH_ADDRESS:?Set OSH_ADDRESS in .env}
  OSH_PORT: "${OSH_PORT:-443}"
  OSH_USER: ${OSH_USER:?Set OSH_USER in .env}
  OSH_PASS: ${OSH_PASS:?Set OSH_PASS in .env}
  OSH_ROOT: ${OSH_ROOT:-sensorhub}

services:
  # ── ISS Satellite Tracking (30s cadence) ──
  iss:
    build:
      context: ..
      dockerfile: publishers/iss/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "30"]

  # ── NWS Surface Observations (1h cadence) ──
  nws:
    build:
      context: ..
      dockerfile: publishers/nws/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "3600"]

  # ── NDBC Buoy Met Observations (1h cadence) ──
  ndbc:
    build:
      context: ..
      dockerfile: publishers/ndbc/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "3600"]

  # ── NDBC BuoyCAM Imagery (15min cadence) ──
  ndbc-buoycam:
    build:
      context: ..
      dockerfile: publishers/ndbc/Dockerfile.buoycam
    restart: always
    environment:
      <<: *osh-env
      BUOYCAM_CACHE_ROOT: /var/www/buoycam
      BUOYCAM_CACHE_BASE_URL: ${BUOYCAM_CACHE_BASE_URL:-}
    volumes:
      - buoycam-cache:/var/www/buoycam
    command: ["--interval", "900"]

  # ── CO-OPS Coastal Observations (6min cadence) ──
  coops:
    build:
      context: ..
      dockerfile: publishers/coops/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "360"]

  # ── AviationWeather METAR (5min cadence) ──
  aviation-wx:
    build:
      context: ..
      dockerfile: publishers/aviation_wx/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "300"]

  # ── OpenSky ADS-B Feed (5min cadence) ──
  opensky:
    build:
      context: ..
      dockerfile: publishers/opensky/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "300"]

  # ── USGS Water Monitoring (15min cadence) ──
  usgs-water:
    build:
      context: ..
      dockerfile: publishers/usgs_water/Dockerfile
    restart: always
    environment:
      <<: *osh-env
      # USGS_API_KEY: "${USGS_API_KEY:-}"
    command: ["--interval", "900"]

  # ── USGS NIMS Imagery (15min cadence) ──
  usgs-nims:
    build:
      context: ..
      dockerfile: publishers/usgs_nims/Dockerfile
    restart: always
    environment:
      <<: *osh-env
      # USGS_API_KEY: "${USGS_API_KEY:-}"
    command: ["--interval", "900"]

  # ── USGS Earthquake Feed (60s cadence) ──
  usgs-eq:
    build:
      context: ..
      dockerfile: publishers/usgs_eq/Dockerfile
    restart: always
    environment:
      <<: *osh-env
    command: ["--interval", "60"]

volumes:
  buoycam-cache:
